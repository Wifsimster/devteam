name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Bump Version
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push'
      && github.actor != 'github-actions[bot]'
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bump version based on conventional commit
        id: bump
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          FIRST_LINE=$(echo "$COMMIT_MSG" | head -1)
          CURRENT=$(cat VERSION)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          BUMPED=false

          # Breaking change: major bump
          if echo "$FIRST_LINE" | grep -qE '^(feat|fix)(\(.+\))?!:' || echo "$COMMIT_MSG" | grep -q 'BREAKING CHANGE'; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
            BUMPED=true
          # feat: minor bump
          elif echo "$FIRST_LINE" | grep -qE '^feat(\(.+\))?:'; then
            MINOR=$((MINOR + 1))
            PATCH=0
            BUMPED=true
          # fix: patch bump
          elif echo "$FIRST_LINE" | grep -qE '^fix(\(.+\))?:'; then
            PATCH=$((PATCH + 1))
            BUMPED=true
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"

          if [ "$BUMPED" = "true" ]; then
            echo "$NEW_VERSION" > VERSION
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add VERSION
            git commit -m "chore: bump version to $NEW_VERSION"
            git tag "v$NEW_VERSION"
            git push origin main --tags
          fi

  publish:
    name: Build & Publish Docker Image
    runs-on: ubuntu-latest
    needs: [version]
    # Run unless triggered by bot; handle both version success and skipped (workflow_dispatch)
    if: >-
      always()
      && github.actor != 'github-actions[bot]'
      && (needs.version.result == 'success' || needs.version.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/wifsimster/devteam:latest
            ghcr.io/wifsimster/devteam:${{ steps.version.outputs.version }}
            ghcr.io/wifsimster/devteam:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          platforms: linux/amd64

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [publish]
    if: always() && needs.publish.result == 'success'
    steps:
      - name: Deploy
        run: /home/deploy/deploy-devteam.sh
